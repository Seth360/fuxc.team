<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FUXC.TEAM 后台登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body class="login-page">
    <main class="admin-app">
      <section class="admin-login">
        <div class="admin-login-card">
          <p class="admin-eyebrow">FUXC.TEAM ACCESS</p>
          <h1>登录 / 注册</h1>
          <p>管理员和普通成员都从这里进入。管理员登录后跳转后台，普通成员登录后回到前台。</p>
          <div class="admin-auth-tabs" role="tablist" aria-label="登录或注册">
            <button class="admin-auth-tab is-active" id="login-tab-button" type="button" data-auth-tab="login" aria-selected="true">
              登录
            </button>
            <button class="admin-auth-tab" id="register-tab-button" type="button" data-auth-tab="register" aria-selected="false">
              注册
            </button>
          </div>
          <form id="login-form">
            <label class="admin-field">
              <span>用户名</span>
              <input id="login-username" type="text" placeholder="请输入用户名" autocomplete="username" required />
            </label>
            <label class="admin-field">
              <span>密码</span>
              <input id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password" required />
            </label>
            <label class="admin-field" id="login-confirm-field" hidden>
              <span>重复密码</span>
              <input id="login-password-confirm" type="password" placeholder="请再次输入密码" autocomplete="new-password" />
            </label>
            <label class="admin-field" id="login-invite-field" hidden>
              <span>邀请码</span>
              <input id="login-invite-code" type="text" placeholder="请输入邀请码" />
            </label>
            <div class="admin-login-actions">
              <button class="admin-button admin-button-primary" id="login-primary-button" type="submit">登录</button>
              <a class="admin-button admin-button-ghost" href="./index.html">取消</a>
            </div>
            <p class="admin-error" id="login-error" hidden></p>
          </form>
        </div>
      </section>
    </main>

    <script src="./content.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
