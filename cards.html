<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全部应用卡片 | FUXC.TEAM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="cards-page-body">
    <main class="cards-page-shell">
      <header class="cards-page-header">
        <div>
          <p class="section-tag">Application Library</p>
          <h1>全部应用卡片</h1>
          <p class="cards-page-copy">这里展示站点内全部 Agent、浏览器插件与 Skill 卡片。</p>
        </div>
        <div class="cards-page-actions">
          <a class="ghost-action" href="./index.html#catalog">返回首页</a>
        </div>
      </header>

      <section class="cards-page-panel">
        <div class="catalog-toolbar">
          <div class="filter-bar" id="cards-filter-bar" role="tablist" aria-label="作品类别过滤"></div>
          <div class="cards-page-toolbar-side">
            <div class="catalog-actions" id="cards-page-actions">
              <span class="catalog-user" id="cards-page-user" hidden></span>
              <button class="catalog-add-button" id="cards-page-add-button" type="button" hidden>
                ADD
              </button>
            </div>
            <div class="catalog-meta">
              <span class="meta-label">Visible Items</span>
              <strong id="cards-visible-count">0</strong>
            </div>
          </div>
        </div>

        <div class="card-grid cards-page-grid" id="cards-page-grid" aria-live="polite"></div>
      </section>
    </main>

    <div class="card-modal" id="card-modal" hidden>
      <button class="card-modal-backdrop" type="button" aria-label="关闭详情弹窗" data-close-modal></button>
      <section
        class="card-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button class="card-modal-close" type="button" aria-label="关闭详情弹窗" data-close-modal>
          ×
        </button>
        <div class="card-modal-visual" id="modal-visual"></div>
        <div class="card-modal-content">
          <div class="card-modal-head">
            <div>
              <p class="card-modal-label" id="modal-label"></p>
              <h3 id="modal-title"></h3>
            </div>
            <a
              class="card-modal-link"
              id="modal-github-link"
              href="#"
              target="_blank"
              rel="noreferrer"
            >
              查看 GitHub
            </a>
          </div>
          <p class="card-modal-description" id="modal-description"></p>
          <div class="card-modal-meta" id="modal-meta"></div>
          <div class="card-modal-tags" id="modal-tags"></div>
        </div>
      </section>
    </div>

    <div class="creator-modal" id="creator-modal" hidden>
      <button class="creator-modal-backdrop" type="button" aria-label="关闭上传弹窗" data-close-creator></button>
      <section class="creator-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="creator-modal-title">
        <div class="creator-modal-head">
          <div>
            <p class="section-tag">Add New Build</p>
            <h2 id="creator-modal-title">上传我的应用卡片</h2>
            <p class="creator-modal-copy">最新上传会默认排在第一张，管理员可在后台拖动排序。</p>
          </div>
          <button class="ghost-action auth-close" type="button" data-close-creator>取消</button>
        </div>

        <form class="creator-form" id="creator-form">
          <div class="creator-grid">
            <label class="creator-field">
              <span>类型</span>
              <select id="creator-type"></select>
            </label>
            <label class="creator-field creator-field-full">
              <span>应用名称</span>
              <input id="creator-title" type="text" placeholder="请输入应用名称" required />
            </label>
            <label class="creator-field creator-field-full">
              <span>文字介绍</span>
              <textarea id="creator-description" rows="4" placeholder="介绍一下你的应用亮点"></textarea>
            </label>
            <label class="creator-field">
              <span>Stack</span>
              <input id="creator-stack" type="text" placeholder="AI + Automation" />
            </label>
            <label class="creator-field">
              <span>Mode</span>
              <input id="creator-mode" type="text" placeholder="In-browser action" />
            </label>
            <label class="creator-field creator-field-full">
              <span>标签 tags</span>
              <input id="creator-tags" type="text" placeholder="Prompt, Workflow, Demo" />
            </label>
            <label class="creator-field creator-field-full">
              <span>GitHub 项目链接</span>
              <input id="creator-github" type="url" placeholder="https://github.com/..." />
            </label>
            <label class="creator-field creator-field-full">
              <span>截图链接</span>
              <input id="creator-screenshot" type="url" placeholder="https://... 或留空使用上传文件" />
            </label>
            <label class="creator-field creator-field-full">
              <span>上传截图</span>
              <input id="creator-screenshot-file" type="file" accept="image/*" />
            </label>
          </div>

          <div class="creator-preview" id="creator-preview">暂无截图预览</div>
          <p class="auth-error" id="creator-error" hidden></p>

          <div class="auth-actions">
            <button class="primary-action auth-submit" type="submit">提交卡片</button>
            <button class="ghost-action auth-submit" type="button" data-close-creator>取消</button>
          </div>
        </form>
      </section>
    </div>

    <script src="./content.js"></script>
    <script src="./card-list.js"></script>
  </body>
</html>
