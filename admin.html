<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FUXC.TEAM 后台管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <main class="admin-app">
      <section class="admin-shell" id="admin-shell">
        <header class="admin-header">
          <div>
            <p class="admin-eyebrow">Content Manager</p>
            <h1>网站内容后台</h1>
            <p>先切换分页，再编辑对应内容。保存后，首页会读取这份最新数据。</p>
          </div>
          <div class="admin-header-actions">
            <a class="admin-button admin-button-ghost" href="./index.html" target="_blank" rel="noreferrer">
              打开前台
            </a>
            <button class="admin-button admin-button-ghost" id="reset-site" type="button">
              恢复默认内容
            </button>
            <button class="admin-button admin-button-primary" id="logout-button" type="button">
              退出后台
            </button>
          </div>
        </header>

        <div class="admin-workspace">
          <nav class="admin-nav" aria-label="后台分页">
            <button class="admin-nav-item is-active" type="button" data-page="copy">
              基本信息
            </button>
            <button class="admin-nav-item" type="button" data-page="cards">
              应用管理
            </button>
          </nav>

          <div class="admin-content">
            <section class="admin-page is-active" data-page-panel="copy">
              <section class="admin-panel">
                <div class="admin-panel-head">
                  <div>
                    <p class="admin-eyebrow">Basic Info</p>
                    <h2>首屏文案</h2>
                  </div>
                  <button class="admin-button admin-button-primary" id="save-hero" type="button">
                    保存首屏内容
                  </button>
                </div>
                <div class="admin-grid">
                  <label class="admin-field">
                    <span>Kicker</span>
                    <input id="hero-kicker-input" type="text" />
                  </label>
                  <label class="admin-field">
                    <span>Lead</span>
                    <input id="hero-lead-input" type="text" />
                  </label>
                  <label class="admin-field admin-field-full">
                    <span>主标题</span>
                    <input id="hero-title-input" type="text" />
                  </label>
                  <label class="admin-field admin-field-full">
                    <span>副标题</span>
                    <input id="hero-subtitle-input" type="text" />
                  </label>
                  <label class="admin-field admin-field-full">
                    <span>说明文案</span>
                    <textarea id="hero-description-input" rows="4"></textarea>
                  </label>
                  <label class="admin-field">
                    <span>主按钮文案</span>
                    <input id="hero-primary-input" type="text" />
                  </label>
                  <label class="admin-field">
                    <span>次按钮文案</span>
                    <input id="hero-secondary-input" type="text" />
                  </label>
                </div>
              </section>

              <section class="admin-panel">
                <div class="admin-panel-head">
                  <div>
                    <p class="admin-eyebrow">Catalog Editor</p>
                    <h2>第二屏标题区</h2>
                  </div>
                  <button class="admin-button admin-button-primary" id="save-catalog" type="button">
                    保存第二屏标题
                  </button>
                </div>
                <div class="admin-grid">
                  <label class="admin-field">
                    <span>Section Tag</span>
                    <input id="catalog-tag-input" type="text" />
                  </label>
                  <label class="admin-field admin-field-full">
                    <span>第二屏标题</span>
                    <input id="catalog-title-input" type="text" />
                  </label>
                  <label class="admin-field admin-field-full">
                    <span>第二屏说明</span>
                    <textarea id="catalog-description-input" rows="4"></textarea>
                  </label>
                </div>
              </section>
            </section>

            <section class="admin-page" data-page-panel="cards">
              <section class="admin-panel">
                <div class="admin-panel-head">
                  <div>
                    <p class="admin-eyebrow">App Manager</p>
                    <h2>应用管理</h2>
                  </div>
                  <button class="admin-button admin-button-primary" id="create-card" type="button">
                    新建卡片
                  </button>
                </div>
                <div class="admin-card-list" id="admin-card-list"></div>
              </section>
            </section>
          </div>
        </div>
      </section>
    </main>

    <div class="admin-modal" id="card-modal" hidden>
      <button class="admin-modal-backdrop" type="button" aria-label="关闭卡片弹窗" data-close-card-modal></button>
      <section class="admin-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
        <div class="admin-modal-head">
          <div>
            <p class="admin-eyebrow">Card Editor</p>
            <h2 id="card-modal-title">新建卡片</h2>
          </div>
          <button class="admin-button admin-button-ghost" type="button" data-close-card-modal>
            关闭
          </button>
        </div>

        <form class="admin-card-form" id="card-form">
          <input id="card-id-input" type="hidden" />
          <div class="admin-grid">
            <label class="admin-field">
              <span>类型 type</span>
              <select id="card-type-input">
                <option value="agent">agent</option>
                <option value="extension">extension</option>
                <option value="skill">skill</option>
              </select>
            </label>
            <label class="admin-field">
              <span>标签 label</span>
              <input id="card-label-input" type="text" placeholder="Agent" />
            </label>
            <label class="admin-field">
              <span>状态 badge</span>
              <input id="card-badge-input" type="text" placeholder="New / Sample" />
            </label>
            <label class="admin-field admin-field-full">
              <span>名称</span>
              <input id="card-title-input" type="text" placeholder="项目名称" required />
            </label>
            <label class="admin-field admin-field-full">
              <span>文字介绍</span>
              <textarea id="card-description-input" rows="5" placeholder="卡片描述"></textarea>
            </label>
            <label class="admin-field">
              <span>Stack</span>
              <input id="card-stack-input" type="text" placeholder="Chrome / Edge" />
            </label>
            <label class="admin-field">
              <span>Mode</span>
              <input id="card-mode-input" type="text" placeholder="In-browser action" />
            </label>
            <label class="admin-field admin-field-full">
              <span>标签 tags</span>
              <input id="card-tags-input" type="text" placeholder="Lead Flow, Prompt Routing" />
            </label>
            <label class="admin-field admin-field-full">
              <span>GitHub 项目链接</span>
              <input id="card-github-input" type="url" placeholder="https://github.com/..." />
            </label>
            <label class="admin-field admin-field-full">
              <span>截图链接</span>
              <input id="card-screenshot-input" type="url" placeholder="https://... 或留空使用上传文件" />
            </label>
            <label class="admin-field admin-field-full">
              <span>上传截图</span>
              <input id="card-screenshot-file-input" type="file" accept="image/*" />
              <small class="admin-field-hint">建议尺寸：1600 × 900 或 1280 × 720，16:9 比例。</small>
            </label>
          </div>

          <div class="admin-image-preview" id="card-preview">暂无截图预览</div>

          <div class="admin-form-actions">
            <button class="admin-button admin-button-primary" type="submit">保存卡片</button>
            <button class="admin-button admin-button-ghost" id="reset-card-form" type="button">
              清空表单
            </button>
          </div>
        </form>
      </section>
    </div>

    <script src="./content.js"></script>
    <script src="./admin.js"></script>
  </body>
</html>
