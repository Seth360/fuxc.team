          <strong>FUXC.TEAM</strong>
          <span>打造ShareAgent极致体验</span>
        </div>
      </aside>

      <main class="content">
        <section class="page-view" aria-label="设计质检">
          <section class="section">
            <div class="quality-list-view" id="qualityListView">
            <div class="section-head">
              <div>
                <div class="section-kicker">Quality</div>
                <h2 class="section-title">设计质检</h2>
                <p class="section-note">按中文与国际化两个维度追踪页面设计质量，点击卡片查看对应质检报告。</p>
              </div>
            </div>

            <div class="quality-toolbar">
              <div class="quality-tabs" role="tablist" aria-label="设计质检分类">
                <button class="quality-tab is-active" type="button" data-quality-tab="zh">中文</button>
                <button class="quality-tab" type="button" data-quality-tab="i18n">国际化</button>
              </div>
              <button class="primary-btn upload-report-btn" type="button" id="openReportUpload">上传报告</button>
            </div>

            <div class="quality-panel is-active" data-quality-panel="zh">
              <div class="card-grid" data-report-grid="zh">
                <a class="directory-card quality-card" href="#home-report" data-report-id="home-report" data-report-url="UIcheckReport/UIcheckReport1.html" data-report-title="首页质检报告" data-report-date="2026-06-20" data-report-score="86" data-report-summary="快速总览、项目链接、竞品和成员模块的设计质量检查。" data-report-body="首页总体评分 86。主要问题集中在入口优先级、卡片信息密度和质检入口显性程度，建议下一轮收敛顶部空间与卡片状态表达。">
                  <div>
                    <div class="card-main-row"><span class="card-logo">首</span><div class="card-title">首页</div></div>
                    <div class="card-desc">快速总览、项目链接、竞品和成员模块的设计质量检查。</div>
                    <div class="quality-meta"><span class="tag">2026-06-20</span><span class="tag">设计质量</span></div>
                  </div>
                  <span class="score-ring" data-score-tone="high" style="--score: 86">86</span>
                </a>
              </div>
            </div>

            <div class="quality-panel" data-quality-panel="i18n">
              <div class="card-grid" data-report-grid="i18n">
              </div>
            </div>

            </div>

            <div class="quality-report-view" id="qualityReportView" aria-live="polite">
              <div class="report-view-toolbar">
                <button class="report-back-btn" type="button" id="backToQualityList" aria-label="返回设计质检列表">返回</button>
                <div class="report-view-meta">
                  <div class="section-kicker">Quality Report</div>
                  <h2 class="report-view-title" id="embeddedReportTitle">首页质检报告</h2>
                  <p class="report-view-summary" id="embeddedReportSummary">快速总览、项目链接、竞品和成员模块的设计质量检查。</p>
                  <div class="quality-meta">
                    <span class="tag" id="embeddedReportDate">2026-06-20</span>
                    <span class="tag">首页</span>
                    <span class="tag" id="embeddedReportScore">设计质量 86</span>
                  </div>
                </div>
                <div class="report-toolbar-actions">
                  <button class="secondary-btn" type="button" id="editCurrentReport">更新报告</button>
                  <button class="danger-btn" type="button" id="deleteCurrentReport">删除</button>
                </div>
              </div>
              <iframe class="embedded-report-frame" id="embeddedReportFrame" title="首页质检报告内容"></iframe>
            </div>
          </section>
        </section>
      </main>
    </div>

    <div class="editor-backdrop" id="editorBackdrop"></div>
    <aside class="editor-panel report-upload-panel" id="reportUploadPanel" aria-label="上传设计质检报告" aria-hidden="true">
      <div class="editor-head">
        <h2 class="editor-title" id="reportUploadTitle">上传报告</h2>
        <button class="close-btn" type="button" id="closeReportUpload" aria-label="关闭上传报告面板">×</button>
      </div>
      <form class="edit-form" id="reportUploadForm">
        <div class="field">
          <label for="reportTitleInput">标题</label>
          <input id="reportTitleInput" name="title" type="text" />
        </div>
        <div class="field">
          <label for="reportFileInput">设计质检报告</label>
          <label class="report-file-upload" for="reportFileInput">
            <span class="report-file-title">上传HTML</span>
            <span class="report-file-name" id="reportFileName">选择 .html 文件</span>
          </label>
          <input id="reportFileInput" name="htmlFile" class="report-file-input" type="file" accept=".html,.htm,text/html" />
        </div>
        <div class="editor-actions">
          <button class="secondary-btn" type="button" id="cancelReportUpload">取消</button>
          <button class="primary-btn" type="submit">保存</button>
        </div>
      </form>
    </aside>
    <aside class="editor-panel" id="editorPanel" aria-label="编辑项目链接卡片" aria-hidden="true">
      <div class="editor-head">
        <h2 class="editor-title" id="editorTitle">编辑卡片</h2>
        <button class="close-btn" type="button" id="closeEditor" aria-label="关闭编辑面板">×</button>
      </div>
      <form class="edit-form" id="editForm">
        <div class="field">
          <label for="editTitle">标题</label>
          <input id="editTitle" name="title" type="text" />
        </div>
        <div class="field" id="editDescField">
          <label for="editDesc">简介</label>
          <textarea id="editDesc" name="desc"></textarea>
        </div>
        <div class="field">
          <label for="editTags">标签</label>
          <input id="editTags" name="tags" type="text" placeholder="多个标签用逗号分隔" />
        </div>
        <div class="field">
          <label for="editHref">链接地址</label>
          <input id="editHref" name="href" type="text" placeholder="https:// 或相对路径" />
        </div>
        <div class="editor-actions">
          <button class="danger-btn" type="button" id="deleteCard" hidden>删除</button>
          <button class="secondary-btn" type="button" id="cancelEditor">取消</button>
          <button class="primary-btn" type="submit">保存</button>
        </div>
      </form>
    </aside>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
