name = "shareagent-uxhub-api"
main = "api-worker.js"
compatibility_date = "2026-06-20"

[[kv_namespaces]]
binding = "UXHUB_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

